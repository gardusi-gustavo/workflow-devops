name: ci-python
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      command:
        type: string
        default: "python3 -m compileall -q src"
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run
        run: ${{ inputs.command }}
