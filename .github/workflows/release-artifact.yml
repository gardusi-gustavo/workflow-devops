name: release-artifact
on:
  workflow_call:
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive
        run: |
          mkdir -p dist
          git archive --format=zip --output "dist/${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}.zip" HEAD
          sha256sum dist/*.zip > dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
