name: agent
on:
  workflow_call:
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  handle:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Validate and dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [[ "$BODY" == /agent* ]] || exit 0
          [[ "$COMMENT_USER" != *"[bot]" ]] || exit 0
          permission="$(gh api "repos/$REPO/collaborators/$COMMENT_USER/permission" --jq .permission)"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "ignored: $COMMENT_USER has $permission"; exit 0 ;;
          esac
          command="$(printf '%s' "$BODY" | sed 's#^/agent[[:space:]]*##')"
          payload="$(jq -nc --arg command "$command" --arg user "$COMMENT_USER" --argjson issue "$ISSUE" '{command:$command,user:$user,issue:$issue}')"
          gh api "repos/$REPO/dispatches" \
            -f event_type=agent-command \
            -f "client_payload=$payload"
