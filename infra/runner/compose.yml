services:
  runner:
    image: gitea/runner:5
    container_name: gitea-runner-rootless
    restart: unless-stopped
    network_mode: bridge
    environment:
      CONFIG_FILE: /config.yml
      HOME: /data
      XDG_CACHE_HOME: /data/.cache
      GITEA_INSTANCE_URL: ${GITEA_INSTANCE_URL:-http://172.18.0.1:3001}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-local-runner}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-}
    volumes:
      - ./data:/data
      - ./config.yml:/config.yml:ro
      - /run/user/1500/docker.sock:/run/user/1500/docker.sock
      - /run/user/1500/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "gitea:172.18.0.1"
      - "gitea.localhost:172.18.0.1"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 2048
