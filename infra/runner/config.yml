log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 60m
  labels:
    - "ci-universal:docker://gitea/ci-universal:latest"
    - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest"

container:
  docker_host: "-"
  network: bridge
  options: "--memory=3g --memory-swap=6g --cpus=2 --cpu-shares=512 --pids-limit=1024 --add-host=gitea:172.18.0.1 --add-host=gitea.localhost:172.18.0.1"

cache:
  enabled: true
